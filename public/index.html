<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf7f0" />
    <meta name="description" content="使用 MoonBit 编写的本地学习打卡、趋势统计与报告助手。" />
    <title>MoonStudy · 学习打卡与统计</title>
    <link rel="stylesheet" href="./styles.css" />
    <!-- Edge 会暂停隐藏页面的原生 rAF；Rabbita 依赖它提交 DOM 补丁。
         使用计时器保持同一异步边界，避免数据已更新但视图一直等待到重新载入。 -->
    <script>
      window.requestAnimationFrame = (callback) => setTimeout(() => callback(performance.now()), 16);
      window.cancelAnimationFrame = (id) => clearTimeout(id);
    </script>
    <script type="module" src="./moonstudy-app_v004.mjs"></script>
    <script type="module" src="./host.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="intro">
        <div>
          <p class="eyebrow">MOONBIT · 本地学习记录</p>
          <h1>今天学了什么？</h1>
          <p>用几分钟留下学习足迹。无需账号，记录只保存在这个浏览器里。</p>
        </div>
        <label class="theme-picker">界面颜色
          <select id="theme-select" aria-label="界面颜色">
            <option value="system">跟随系统</option>
            <option value="light">亮色</option>
            <option value="dark">暗色</option>
          </select>
        </label>
      </header>

      <noscript><p class="notice">此应用需要浏览器启用 JavaScript。</p></noscript>
      <div id="notice" class="notice" role="alert" hidden></div>
      <button id="backup-raw" class="backup" type="button" hidden>下载无法读取的原始数据</button>

      <!-- 表单、概览、图表、主题与历史由 MoonBit + Rabbita 统一渲染。 -->
      <div id="app-main"></div>

      <section class="card" aria-labelledby="report-title">
        <div class="card-heading">
          <h2 id="report-title">学习报告</h2>
          <span class="muted">日报或周报 · Markdown 文本</span>
        </div>
        <p class="report-help">选择报告类型后生成内容，可复制到笔记，也可下载为 `.md` 文件。</p>
        <div class="report-controls">
          <label>报告类型
            <select id="report-type">
              <option value="daily">日报</option>
              <option value="weekly">周报</option>
            </select>
          </label>
          <label id="report-date-label">日报日期
            <input id="report-date" type="date" />
          </label>
        </div>
        <div class="actions">
          <button id="generate-report" class="secondary" type="button">生成日报</button>
          <button id="download-report" class="secondary" type="button" hidden>下载 .md</button>
        </div>
        <label id="report-label" class="report-label" hidden><span id="report-preview-title">日报预览</span>
          <textarea id="report-output" readonly rows="12"></textarea>
        </label>
      </section>

      <section class="card" aria-labelledby="data-title">
        <div class="card-heading">
          <h2 id="data-title">数据备份与恢复</h2>
          <span class="muted">完整 JSON · 只保存在你手中</span>
        </div>
        <p class="report-help">建议提交前和清理浏览器数据前下载备份。恢复时会先由 MoonBit 校验，不会导入损坏文件。</p>
        <div class="actions">
          <button id="export-data" class="secondary" type="button">导出完整备份</button>
          <button id="choose-restore" class="secondary" type="button">选择备份恢复</button>
          <input id="restore-file" type="file" accept="application/json,.json" hidden />
        </div>
      </section>

      <p class="footnote">数据默认只在当前浏览器中保存。换设备前请先导出完整备份。</p>
    </main>
  </body>
</html>
